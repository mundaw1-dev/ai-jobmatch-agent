
# File: C:\Technative\ai-jobmatch-agent\pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-jobmatch-agent"
version = "0.1.0"
description = "AI-assisted job matching with deterministic scoring and evidence-based recommendations"
requires-python = ">=3.10,<3.15"
dependencies = [
    "streamlit>=1.40,<2.0",
    "pydantic>=2.8,<3.0",
    "requests>=2.32,<3.0",
    "langgraph>=0.2.60,<2.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools]
py-modules = ["app", "config", "database", "models", "auth"]

[tool.setuptools.packages.find]
where = ["."]
include = ["graph*", "persistence*", "providers*", "services*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
